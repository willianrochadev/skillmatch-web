<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare suas habilidades com vagas de Front-End e descubra o que estudar."
    />
    <title>SkillMatch Web | Compatibilidade com vagas</title>
    <link rel="stylesheet" href="./assets/styles/index.style.css" />
  </head>
  <body>
    <header>
      <img
        src="./assets/img/logo.svg"
        alt="Logo do SkillMatch"
        width="48"
        height="48"
      />
      <h1>SkillMatch Web</h1>

      <nav aria-label="Navegação principal">
        <a href="#perfil">Preencher perfil</a>
      </nav>
    </header>

    <main>
      <section aria-labelledby="apresentacao-titulo">
        <h2 id="apresentacao-titulo">Encontre vagas compatíveis com você</h2>
        <p>Preencha seu perfil para comparar suas habilidades com as vagas.</p>
      </section>

      <section id="perfil" aria-labelledby="perfil-titulo">
        <h2 id="perfil-titulo">Perfil do candidato</h2>

        <form id="formulario-perfil">
          <div>
            <label for="nome">Nome</label>
            <input
              type="text"
              id="nome"
              name="nome"
              autocomplete="name"
              required
            />
          </div>

          <div>
            <label for="area">Área de atuação</label>
            <input type="text" id="area" name="area" required />
          </div>

          <div>
            <label for="habilidades">Habilidades</label>
            <input
              type="text"
              id="habilidades"
              name="habilidades"
              aria-describedby="habilidades-ajuda"
              required
            />
            <small id="habilidades-ajuda">
              Separe as habilidades por vírgula. Exemplo: HTML, CSS, JavaScript.
            </small>
          </div>

          <div>
            <label for="experiencia-meses">Experiência em meses</label>
            <input
              type="number"
              id="experiencia-meses"
              name="experienciaMeses"
              min="0"
              step="1"
              required
            />
          </div>

          <p id="mensagem-formulario" role="alert" aria-live="assertive"></p>

          <button type="submit">Analisar compatibilidade</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Projeto avaliativo do Módulo 1.</p>
    </footer>

    <script type="module" src="./assets/scripts/main.js"></script>
  </body>
</html>
